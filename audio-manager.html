<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>فحص ملفات الصوت — المعلم سعد</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f6f8fb;margin:0;color:#203040}.wrap{max-width:960px;margin:auto;padding:20px}h1{font-size:clamp(24px,4vw,38px)}.note{background:#fff;border-radius:16px;padding:16px;box-shadow:0 6px 24px #0001;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px #0001}.row{display:flex;align-items:center;gap:8px;margin:9px 0;word-break:break-all}.dot{width:13px;height:13px;border-radius:50%;background:#999;flex:0 0 auto}.ok .dot{background:#20a464}.bad .dot{background:#d64545}.status{font-weight:bold}button,a.btn{border:0;border-radius:10px;padding:9px 12px;background:#2367d1;color:#fff;text-decoration:none;cursor:pointer}code{font-size:12px}.top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
</style></head>
<body><main class="wrap"><h1>فحص التسجيلات الصوتية</h1><div class="note">هذه الصفحة لا ترفع الملفات إلى GitHub، لكنها تفحص تلقائياً الملفات التي أضفتها وتبيّن الموجود والمفقود.</div><div class="top"><button onclick="location.reload()">إعادة الفحص</button><a class="btn" href="index.html">فتح الموقع</a></div><div id="grid" class="grid"></div></main>
<script>
const groups={
'عام':['assets/audio/welcome.mp3'],
'حرف الميم':['assets/audio/meem/intro.mp3','assets/audio/meem/story.mp3','assets/audio/meem/success.mp3'],
'حرف الباء':['assets/audio/baa/intro.mp3','assets/audio/baa/story.mp3','assets/audio/baa/success.mp3'],
'حرف اللام':['assets/audio/laam/intro.mp3','assets/audio/laam/story.mp3','assets/audio/laam/success.mp3'],
'حرف الدال':['assets/audio/daal/intro.mp3','assets/audio/daal/story.mp3','assets/audio/daal/success.mp3'],
'حرف النون':['assets/audio/noon/intro.mp3','assets/audio/noon/story.mp3','assets/audio/noon/success.mp3'],
'حرف الراء':['assets/audio/raa/intro.mp3','assets/audio/raa/story.mp3','assets/audio/raa/success.mp3']};
async function exists(path){try{const r=await fetch(path,{method:'HEAD',cache:'no-store'});return r.ok}catch(e){return false}}
(async()=>{const grid=document.getElementById('grid');for(const [name,files] of Object.entries(groups)){const c=document.createElement('section');c.className='card';c.innerHTML=`<h2>${name}</h2>`;grid.appendChild(c);for(const f of files){const row=document.createElement('div');row.className='row';row.innerHTML=`<span class="dot"></span><code>${f}</code><span class="status">جارٍ الفحص…</span>`;c.appendChild(row);const ok=await exists(f);row.classList.add(ok?'ok':'bad');row.querySelector('.status').textContent=ok?'موجود':'مفقود';}}})();
</script></body></html>
