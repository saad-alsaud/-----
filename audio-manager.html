<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدير الصوت</title><link rel="stylesheet" href="assets/css/app.css"></head><body><main class="container"><div class="card welcome"><h1>مدير ملفات الصوت</h1><p>تحقق من الملفات المطلوبة. ظهور «موجود» يعتمد على إمكانية الوصول إليها من الخادم.</p><a class="cta secondary" href="index.html">العودة للمنصة</a></div><div id="list" class="dashboard"></div></main><script src="assets/js/lesson-data.js"></script><script>const list=document.getElementById('list');for(const [id,l] of Object.entries(window.LESSON_DATA)){const d=document.createElement('div');d.className='card dash-card';d.innerHTML=`<h2>${l.letter} — ${l.name}</h2>`;for(const [type,path] of Object.entries(l.audio)){const p=document.createElement('p');p.textContent=path+' — جارٍ الفحص';fetch(path,{method:'HEAD'}).then(r=>p.textContent=path+' — '+(r.ok?'موجود':'مفقود')).catch(()=>p.textContent=path+' — تعذر الفحص محليًا');d.appendChild(p)}list.appendChild(d)}</script></body></html>
